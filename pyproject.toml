[project]
name = "finalproject-makeev-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор валютного кошелька с сервисом парсинга курсов."
readme = "README.md"
authors = [
    { name = "VladimirMakeev", email = "vlvmakeev88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "prettytable>=3.10.0",
]

[project.scripts]
valutatrade = "finalproject_makeev_m26_555:run"
finalproject-makeev-m26-555 = "finalproject_makeev_m26_555:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
USERS_FILE_PATH = "data/users.json"
PORTFOLIOS_FILE_PATH = "data/portfolios.json"
RATES_FILE_PATH = "data/rates.json"
EXCHANGE_RATES_FILE_PATH = "data/exchange_rates.json"
LOG_FILE_PATH = "logs/actions.log"
LOG_LEVEL = "INFO"
RATES_TTL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
REQUEST_TIMEOUT = 10
